services:
  - type: web
    name: tssplusplus-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn --app-dir backend app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: tssplusplus
      - key: TSS_TERM
        value: fa26
      - key: ORS_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
